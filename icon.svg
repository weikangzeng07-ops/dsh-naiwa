<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Naiwa pet">
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#a8e063"/>
      <stop offset="55%" stop-color="#7cc242"/>
      <stop offset="100%" stop-color="#4e8c22"/>
    </radialGradient>
    <radialGradient id="belly" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f4ffd9"/>
      <stop offset="100%" stop-color="#d6efac"/>
    </radialGradient>
  </defs>
  <!-- body -->
  <ellipse cx="32" cy="40" rx="20" ry="18" fill="url(#body)"/>
  <!-- belly -->
  <ellipse cx="32" cy="45" rx="13" ry="11" fill="url(#belly)"/>
  <!-- eyes: the big green eye with a movable pupil is the pet's signature -->
  <ellipse cx="25" cy="31" rx="6.4" ry="6.9" fill="#3f7a1b"/>
  <ellipse cx="25" cy="31" rx="5.4" ry="5.9" fill="#6fbf3a"/>
  <ellipse cx="25.8" cy="31.8" rx="2.5" ry="3.2" fill="#12180d"/>
  <circle cx="24.6" cy="30.2" r="0.8" fill="#ffffff" opacity="0.75"/>
  <ellipse cx="39" cy="31" rx="6.4" ry="6.9" fill="#3f7a1b"/>
  <ellipse cx="39" cy="31" rx="5.4" ry="5.9" fill="#6fbf3a"/>
  <ellipse cx="39.8" cy="31.8" rx="2.5" ry="3.2" fill="#12180d"/>
  <circle cx="38.6" cy="30.2" r="0.8" fill="#ffffff" opacity="0.75"/>
  <!-- mouth -->
  <path d="M27 39.5 Q32 44 37 39.5" fill="none" stroke="#2f5a12" stroke-width="1.8" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="24" cy="57" rx="6" ry="3.4" fill="#4e8c22"/>
  <ellipse cx="40" cy="57" rx="6" ry="3.4" fill="#4e8c22"/>
  <!-- blush -->
  <ellipse cx="17.5" cy="37" rx="2.6" ry="1.7" fill="#f08a8a" opacity="0.55"/>
  <ellipse cx="46.5" cy="37" rx="2.6" ry="1.7" fill="#f08a8a" opacity="0.55"/>
</svg>
